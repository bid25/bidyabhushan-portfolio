<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <style>
      .code { font-family: "Courier New", Courier, monospace; font-weight: bold; fill: #ffffff; opacity: 0.7; }
      .small { font-size: 18px; opacity: 0.4; }
      .med { font-size: 24px; opacity: 0.6; }
      .large { font-size: 36px; opacity: 0.9; }
    </style>
  </defs>
  
  <text x="30" y="50" class="code large">&lt;/&gt;</text>
  <text x="180" y="40" class="code med">{ }</text>
  <text x="100" y="100" class="code small">=&gt;</text>
  <text x="240" y="120" class="code large">[]</text>
  <text x="40" y="160" class="code med">const</text>
  <text x="140" y="180" class="code large">();</text>
  <text x="220" y="200" class="code small">$$</text>
  <text x="60" y="250" class="code med">let</text>
  <text x="160" y="270" class="code large">&amp;&amp;</text>
  <text x="260" y="60" class="code small">fn</text>
  <text x="10" y="110" class="code small">||</text>
  <text x="240" y="270" class="code med">===</text>
  <text x="120" y="40" class="code small">/**/</text>
</svg>
